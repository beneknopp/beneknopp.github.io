<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zum Geburtstag</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #F3DCE7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            justify-content: space-between;
            width: 90%;
            height: 90%;
        }
        .column {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            width: 30%;
        }
        .left-column img,
        .right-column img {
            width: 500px;
            height: 80px;
            margin-bottom: 10px;
        }
        .center-column img {
            width: 600px;
            height: 100px;
        }
        .center-column .large {
            height: 300px;
            width: auto;
            margin: 20px 0;
        }
        form {
            background: #F194BB;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 20px;
			background-color: #F3DCE7;
			margin-right: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #F3DCE7;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
			visibility: visible;
        }
        button:hover {
            background-color: #F194BB;
        }		
    </style>
</head>
<body>

    <div class="container content">
        <div class="column center-column">
			<form style="display: flex; flex-direction: column;" id="visitorNameeForm">
				<label for="date">Bitte gib deinen Vornamen ein:</label>
				<input 
					type="text" 
					id="date" 
					name="date" 
					placeholder="DD/MM" 
					pattern="\d{2}/\d{2}"
					required >
				<button class="hidden-content" style="color: #F194BB;" type="submit">OK</button>
			</form>

					if (response.ok) {
						const result = await response.text();
						
						alert(result);
					} else {
						alert("There was an error submitting the form.");
					}
				});
			</script>
        </div>
    </div>
</body>
</html>
