<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Form</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .form-container input[type="checkbox"] {
            margin: 20px 0;
        }
        .form-container button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <form id="checkboxForm" action="https://example.com/submit" method="POST">
            <label>
                <input type="checkbox" name="accept" value="yes">
                I agree to the terms and conditions
            </label>
            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        document.getElementById('checkboxForm').addEventListener('submit', function(event) {
            const checkbox = this.querySelector('input[type="checkbox"]');
            if (!checkbox.checked) {
                event.preventDefault();
                alert('You must check the box before submitting!');
            }
        });
    </script>
</body>
</html>
